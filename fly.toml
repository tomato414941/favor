# Favor in production: one machine in Tokyo with its SQLite data on the favor_data volume. Keys are Fly secrets:
# STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_ACCOUNT_ID, CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY,
# RESEND_API_KEY, FAVOR_EMAIL_FROM, FAVOR_PUBLIC_PROFILE.
app = 'favor'
primary_region = 'nrt'

[build]
  dockerfile = 'ops/Dockerfile'

[env]
  FAVOR_PUBLIC_ORIGIN = 'https://hellofavor.app'
  FAVOR_AUTH_MODE = 'clerk'
  FAVOR_PAYMENT_MODE = 'stripe_live'
  FAVOR_MAIL_DELIVERY = 'resend'
  FAVOR_DATA_DIR = '/data'
  FAVOR_BIND = '0.0.0.0'
  FAVOR_PORT = '8080'
  FAVOR_TRUST_PROXY = 'proxy'

# One writer for one SQLite file: never more than one machine, and it keeps running for its timers.
[[mounts]]
  source = 'favor_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    [http_service.checks.headers]
      Host = 'hellofavor.app'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
