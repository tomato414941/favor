name: favor-staging

services:
  app:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: favor-staging:${FAVOR_RELEASE:-latest}
    init: true
    network_mode: host
    restart: unless-stopped
    environment:
      FAVOR_PAYMENT_MODE: stripe_test
      STRIPE_API_KEY: ${STRIPE_API_KEY:?Set STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      STRIPE_ACCOUNT_ID: ${STRIPE_ACCOUNT_ID:?Set STRIPE_ACCOUNT_ID}
      FAVOR_AUTH_MODE: clerk
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY}
      FAVOR_MAIL_DELIVERY: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      FAVOR_EMAIL_FROM: ${FAVOR_EMAIL_FROM:?Set FAVOR_EMAIL_FROM}
      FAVOR_TEST_MAIL_DOMAIN: ${FAVOR_TEST_MAIL_DOMAIN:-favor.test}
      FAVOR_PUBLIC_ORIGIN: https://${FAVOR_HOST:?Set FAVOR_HOST}
      FAVOR_TRUST_PROXY: loopback
      FAVOR_PORT: ${FAVOR_PORT:-3212}
      FAVOR_DATA_DIR: /var/lib/favor
    volumes:
      - data:/var/lib/favor
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "import {get} from 'node:http'; get({hostname: '127.0.0.1', port: process.env.FAVOR_PORT, path: '/api/health', headers: {host: new URL(process.env.FAVOR_PUBLIC_ORIGIN).host}}, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  proxy:
    image: caddy:2.11.4-alpine
    network_mode: host
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FAVOR_HOST: ${FAVOR_HOST:?Set FAVOR_HOST}
      FAVOR_BIND_ADDRESS: ${FAVOR_BIND_ADDRESS:?Set FAVOR_BIND_ADDRESS}
      FAVOR_PORT: ${FAVOR_PORT:-3212}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

volumes:
  data:
  certificates:
  proxy_config:
