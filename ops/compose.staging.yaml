name: commission-staging

services:
  app:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: commission-staging:${COMMISSION_RELEASE:-latest}
    init: true
    network_mode: host
    restart: unless-stopped
    environment:
      COMMISSION_AUTH_MODE: local
      COMMISSION_PUBLIC_ORIGIN: https://${COMMISSION_HOST:?Set COMMISSION_HOST}
      COMMISSION_TRUST_PROXY: loopback
      COMMISSION_PORT: ${COMMISSION_PORT:-3212}
      COMMISSION_DATA_DIR: /var/lib/commission
    volumes:
      - data:/var/lib/commission
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "import {get} from 'node:http'; get({hostname: '127.0.0.1', port: process.env.COMMISSION_PORT, path: '/api/health', headers: {host: new URL(process.env.COMMISSION_PUBLIC_ORIGIN).host}}, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  proxy:
    image: caddy:2.11.4-alpine
    network_mode: host
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      COMMISSION_HOST: ${COMMISSION_HOST:?Set COMMISSION_HOST}
      COMMISSION_BIND_ADDRESS: ${COMMISSION_BIND_ADDRESS:?Set COMMISSION_BIND_ADDRESS}
      COMMISSION_PORT: ${COMMISSION_PORT:-3212}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

volumes:
  data:
  certificates:
  proxy_config:
